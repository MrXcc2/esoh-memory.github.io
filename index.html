    .memorial-site-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(180deg, rgba(15, 23, 42, 0.72) 0%, rgba(15, 23, 42, 0.56) 45%, rgba(15, 23, 42, 0.82) 100%),
        radial-gradient(circle at 75% 25%, rgba(220, 38, 38, 0.16), transparent 55%),
        var(--gatchina-bg-image);
      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
    }

    .memorial-hero-banner {
      position: relative;
      overflow: hidden;
      background-image:
        linear-gradient(90deg, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.74) 46%, rgba(15, 23, 42, 0.18) 100%),
        linear-gradient(180deg, rgba(15, 23, 42, 0.25) 0%, rgba(15, 23, 42, 0.1) 50%, rgba(15, 23, 42, 0.82) 100%),
        var(--gatchina-bg-image);
      background-size: cover;
      background-position: center 28%;
      background-repeat: no-repeat;
    }

    .map-viewport-box {
      position: relative;
      isolation: isolate;
      z-index: 10;
      width: 100%;
      height: 600px;
      min-height: 460px;
    }

    @media (max-width: 640px) {
      .map-viewport-box {
        height: 460px;
      }
    }

    .museum-map .leaflet-tile-pane {
      filter: grayscale(75%) contrast(105%);
    }

    .museum-map.leaflet-container {
      width: 100% !important;
      height: 100% !important;
      background-color: #E2E8F0;
      font-family: 'Inter', sans-serif;
      z-index: 10;
    }

    .leaflet-control-attribution svg,
    .leaflet-control-attribution {
      display: none !important;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.8);
        opacity: 0.85;
      }
      70% {
        transform: scale(2.35);
        opacity: 0;
      }
      100% {
        transform: scale(2.35);
        opacity: 0;
      }
    }

    @keyframes pulse-ring-active {
      0% {
        transform: scale(0.9);
        opacity: 0.95;
      }
      70% {
        transform: scale(2.9);
        opacity: 0;
      }
      100% {
        transform: scale(2.9);
        opacity: 0;
      }
    }

    .memorial-marker-wrapper {
      background: transparent !important;
      border: none !important;
    }

    .memorial-pin {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .memorial-pin::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background-color: rgba(220, 38, 38, 0.45);
      animation: pulse-ring 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .memorial-pin-dot {
      position: relative;
      z-index: 2;
      width: 14px;
      height: 14px;
      border-radius: 9999px;
      background-color: #DC2626;
      border: 2.5px solid #FFFFFF;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.35);
      transition: all 0.25s ease;
    }

    .memorial-pin.is-hovered {
      transform: scale(1.38);
      z-index: 999 !important;
    }

    .memorial-pin.is-hovered::before {
      background-color: rgba(220, 38, 38, 0.7);
      animation: pulse-ring-active 1.3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .memorial-pin.is-hovered .memorial-pin-dot {
      background-color: #B91C1C;
      border-color: #FEF2F2;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.28), 0 4px 12px rgba(15, 23, 42, 0.45);
    }

    .leaflet-tooltip.memorial-tooltip {
      background-color: #0F172A;
      color: #F8FAFC;
      border: 1px solid rgba(220, 38, 38, 0.6);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.35);
    }
  </style>

          const ch = ((e & f) ^ ((~e >>> 0) & g)) >>> 0;
          const temp1 = (h + S1 + ch + K[i] + W[i]) >>> 0;
          const S0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
          const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
          const temp2 = (S0 + maj) >>> 0;
          h = g;
          g = f;
          f = e;
          e = (d + temp1) >>> 0;
          d = c;
          c = b;
          b = a;
          a = (temp1 + temp2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0;
        H[1] = (H[1] + b) >>> 0;
        H[2] = (H[2] + c) >>> 0;
        H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0;
        H[5] = (H[5] + f) >>> 0;
        H[6] = (H[6] + g) >>> 0;
        H[7] = (H[7] + h) >>> 0;
      }
      return H.map((x) => x.toString(16).padStart(8, '0')).join('');
    }

    function verifyAdminPasswordHash(inputPassword) {
      if (!inputPassword) return false;
      let h = ADMIN_HASH_SALT + String(inputPassword).trim();
      for (let i = 0; i < 5000; i++) {
        h = sha256Hex(h);
      }
      return h === ADMIN_SALTED_SHA256_HASH;
    }

      const rawSavedUrl = localStorage.getItem('gatchina_supabase_url') || '';
      const rawSavedKey = localStorage.getItem('gatchina_supabase_key') || '';
      const validSavedUrl =
        rawSavedUrl && !rawSavedUrl.includes('YOUR_PROJECT_ID') && rawSavedUrl.startsWith('https://')
          ? rawSavedUrl
          : '';
      const validSavedKey =
        rawSavedKey && !rawSavedKey.includes('YOUR_SUPABASE_ANON_PUBLIC_KEY')
          ? rawSavedKey
          : '';

      const url = normalizeSupabaseUrl(validSavedUrl || DEFAULT_SUPABASE_URL);

      const isConfigured =

        !url.includes('YOUR_PROJECT_ID') &&

    function downloadQrCodePng(targetUrl, fileName) {
      if (typeof window.qrcode !== 'function') {
        alert('Библиотека генерации QR-кода ещё загружается. Повторите через секунду.');
        return;
      }
      const qr = window.qrcode(0, 'M');
      qr.addData(targetUrl);
      qr.make();

      const moduleCount = qr.getModuleCount();
      const size = 1024;
      const marginModules = 4;
      const totalModules = moduleCount + marginModules * 2;
      const cellSize = size / totalModules;

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = '#0F172A';
      for (let r = 0; r < moduleCount; r++) {
        for (let c = 0; c < moduleCount; c++) {
          if (qr.isDark(r, c)) {
            const x = Math.floor((c + marginModules) * cellSize);
            const y = Math.floor((r + marginModules) * cellSize);
            const w = Math.ceil((c + marginModules + 1) * cellSize) - x;
            const h = Math.ceil((r + marginModules + 1) * cellSize) - y;
            ctx.fillRect(x, y, w, h);
          }
        }
      }

      const dataUrl = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = fileName.endsWith('.png') ? fileName : `${fileName}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ==========================================
    // 4. КОМПОНЕНТ ИНТЕРАКТИВНОЙ КАРТЫ LEAFLET
    // ==========================================
    function GatchinaLeafletMap({
      settlements,
      hoveredSettlementId,
      onHoverSettlement,
      onSelectSettlement,
      heroCountBySettlement
    }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});

      useEffect(() => {
        if (!mapContainerRef.current || mapInstanceRef.current) return;

        const map = L.map(mapContainerRef.current, {
          center: MAP_CENTER,
          zoom: MAP_ZOOM,
          scrollWheelZoom: true,
          attributionControl: false
        });

        L.tileLayer(TILE_URL, {
          subdomains: TILE_SUBDOMAINS,
          maxZoom: 18,
          keepBuffer: 4,
          updateWhenIdle: false
        }).addTo(map);

        mapInstanceRef.current = map;

        settlements.forEach((s) => {
          const count = heroCountBySettlement[s.id] || 0;
          const icon = L.divIcon({
            className: 'memorial-marker-wrapper',
            html: `<div class="memorial-pin" id="pin-${s.id}"><div class="memorial-pin-dot"></div></div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12],
            tooltipAnchor: [0, -14]
          });

          const marker = L.marker(s.coords, { icon }).addTo(map);
          marker.bindTooltip(
            `<div style="text-align:center;">
              <div style="font-weight:600;color:#fff;">${s.name}</div>
              <div style="font-size:11px;color:#FCA5A5;">Героев: ${count} • Нажмите для перехода</div>
            </div>`,
            {
              direction: 'top',
              offset: [0, -10],
              opacity: 1,
              className: 'memorial-tooltip'
            }
          );

          marker.on('mouseover', () => onHoverSettlement(s.id));
          marker.on('mouseout', () => onHoverSettlement(null));
          marker.on('click', () => onSelectSettlement(s.id));

          markersRef.current[s.id] = marker;
        });

        const refreshMapSize = () => {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.invalidateSize({ pan: false });
          }
        };

        refreshMapSize();
        const t1 = setTimeout(refreshMapSize, 100);
        const t2 = setTimeout(refreshMapSize, 350);
        const t3 = setTimeout(refreshMapSize, 800);

        let resizeObserver = null;
        if (window.ResizeObserver && mapContainerRef.current) {
          resizeObserver = new ResizeObserver(() => {
            refreshMapSize();
          });
          resizeObserver.observe(mapContainerRef.current);
        }

        return () => {
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
          if (resizeObserver) resizeObserver.disconnect();
          map.remove();
          mapInstanceRef.current = null;
        };
      }, []);

      useEffect(() => {
        settlements.forEach((s) => {
          const marker = markersRef.current[s.id];
          if (marker) {
            const count = heroCountBySettlement[s.id] || 0;
            marker.setTooltipContent(
              `<div style="text-align:center;">
                <div style="font-weight:600;color:#fff;">${s.name}</div>
                <div style="font-size:11px;color:#FCA5A5;">Героев: ${count} • Нажмите для перехода</div>
              </div>`
            );
          }
        });
      }, [heroCountBySettlement, settlements]);

      useEffect(() => {
        settlements.forEach((s) => {
          const marker = markersRef.current[s.id];
          if (!marker) return;
          const isHovered = hoveredSettlementId === s.id;
          const icon = L.divIcon({
            className: 'memorial-marker-wrapper',
            html: `<div class="memorial-pin ${isHovered ? 'is-hovered' : ''}"><div class="memorial-pin-dot"></div></div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12],
            tooltipAnchor: [0, -14]
          });
          marker.setIcon(icon);
          marker.setZIndexOffset(isHovered ? 1000 : 0);
          if (isHovered) {
            marker.openTooltip();
          } else {
            marker.closeTooltip();
          }
        });
      }, [hoveredSettlementId, settlements]);

      return <div ref={mapContainerRef} className="museum-map w-full h-full" />;
    }
